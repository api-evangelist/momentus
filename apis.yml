name: Momentus
description: >-
  Momentus is a U.S.-based commercial space company providing in-space
  transportation and infrastructure services. Founded in 2017 and headquartered
  in San Jose, California, the publicly traded company (NASDAQ: MNTS) designs,
  manufactures, and operates Orbital Service Vehicles such as its Vigoride
  platform, using water plasma propulsion technology to move satellites and
  payloads between orbits, host payloads, and deliver last-mile satellite
  deployment. Momentus serves private satellite operators, government agencies,
  and research institutions. As of this profile it publishes no public developer
  API, developer portal, SDK, or technical integration surface; it was surfaced
  as a Y Combinator (S18) portfolio company and added to the API Evangelist
  network as a company profile.
